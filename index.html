<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HTML Image Grid</title>
        <link rel="stylesheet" href="styles.css">
    </head> 
    <body>
        <h1>HTML Responsive Image Grid</h1>
        <main> 
            <ul class="image-grid">
                <li><img src="https://picsum.photos/200" alt="Image 1"></li>
                <li><img src="https://picsum.photos/200" alt="Image 2"></li>
                <li><img src="https://picsum.photos/200" alt="Image 3"></li>
                <li><img src="https://picsum.photos/200" alt="Image 4"></li>
                <li><img src="https://picsum.photos/200" alt="Image 5"></li>
                <li class="tall"><img src="https://picsum.photos/200/400" alt="Image 6"></li>
                <li><img src="https://picsum.photos/200" alt="Image 7"></li>
                <li><img src="https://picsum.photos/200" alt="Image 8"></li>
                <li><img src="https://picsum.photos/200" alt="Image 9"></li>
                <li class="wide"><img src="https://picsum.photos/400/200" alt="Image 10"></li>
                <li><img src="https://picsum.photos/200" alt="Image 11"></li>
                <li><img src="https://picsum.photos/200" alt="Image 12"></li>
            </ul>
        </main>
    </body>
</html>
