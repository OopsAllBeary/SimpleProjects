<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HTML Form Component</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <main>
            <div class="form-container">
                <form action="/submit" method="POST">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                    <div class="error-message" id="name-error">Please enter your name.</div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    <div class="error-message" id="email-error">Please enter a valid email address.</div>

                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                    <div class="error-message" id="password-error">Please enter a password.</div>
                    <label for="password-confirm">Confirm Password:</label>
                    <input type="password" id="password-confirm" name="password-confirm" required>
                    <div class="error-message" id="password-confirm-error">Passwords do not match.</div>

                    <button type="submit" class="disabled">Submit</button>

                </form>
                <div class="progress-container">
                    <div class="progress-wheel" style="--progress: 75;">
                        <div class="progress-wheel-inner-text">75%</div>
                    </div>
                    <div class="checklist">
                        <div class="checklist-item completed">Enter Name</div>
                        <div class="checklist-item completed">Enter Email</div>
                        <div class="checklist-item completed">Enter Password</div>
                        <div class="checklist-item">Confirm Password</div>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
